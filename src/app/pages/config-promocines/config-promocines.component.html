<!-- Mostrar la tabla y botón de "Crear promoción" solo si NO se está mostrando el formulario -->
<div *ngIf="!mostrarFormulario">
  <button mat-raised-button color="primary" (click)="abrirFormularioParaCrear()">
    Crear promoción
  </button>

  <!-- Tabla de promociones -->
  <table mat-table [dataSource]="promociones" class="mat-elevation-z2">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let promocion">{{ promocion.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="tipo_descuento">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let promocion">{{ promocion.tipo_descuento }}</td>
    </ng-container>

    <ng-container matColumnDef="descuento">
      <th mat-header-cell *matHeaderCellDef>Descuento</th>
      <td mat-cell *matCellDef="let promocion">{{ promocion.descuento }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Editar</th>
      <td mat-cell *matCellDef="let promocion">
        <button mat-icon-button color="accent" (click)="abrirFormularioParaEditar(promocion)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>
</div>

<!-- Mostrar el formulario solo si mostrarFormulario es true -->
<div *ngIf="mostrarFormulario">
  <app-form-edit-promo
    [data]="promocionSeleccionada"
    (guardar)="guardarPromocion($event)"
    (cancelarEdicion)="mostrarFormulario=false">
  </app-form-edit-promo>
</div>
